name: Deploy portfolio
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'scripts/build_campaign_media.py'
      - 'data/projects.json'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ['Refresh portfolio']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Install media generator
        run: |
          python3 -m pip install --user "Pillow>=10,<13"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
      - name: Assemble public website and original campaign creative
        run: |
          mkdir -p _site/data _site/media
          cp index.html styles.css app.js _site/
          cp data/projects.json _site/data/
          python3 scripts/build_campaign_media.py --out _site/media
          test -s _site/media/launch-instagram.jpg
          test -s _site/media/launch-pinterest.jpg
          test -s _site/media/launch-tiktok.jpg
          test -s _site/media/launch-short.mp4
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
